version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bank_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
    ports:
      - '5432:5432'
    volumes:
      - ./:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
